{% extends 'base_app.html' %}

{% block title %}Eliminar cancha - Kancha Sports{% endblock %}

{% block content %}
<header class="topbar">
    <div>
        <p class="eyebrow">Administracion</p>
        <h1>Eliminar cancha</h1>
    </div>
</header>

<section class="panel form-panel">
    <p>Estas seguro de eliminar <strong>{{ cancha.nombre }}</strong>?</p>
    <form class="app-form" method="post">
        {% csrf_token %}
        <button class="danger-button" type="submit">Eliminar</button>
        <a class="mini-link" href="{% url 'canchas:detalle' cancha.id %}">Cancelar</a>
    </form>
</section>
{% endblock %}
