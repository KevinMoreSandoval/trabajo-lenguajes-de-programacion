{% extends 'staff/base.html' %}
{% block staff_content %}
<section class="panel">
  <div class="section-title"><div><h2>Reservas</h2><p>Gestiona horarios, pagos, asistencia y cancelaciones.</p></div><button class="btn btn-primary" onclick="openModal('reserve-modal')">＋ Crear reserva</button></div>
  <div class="reservation-filters"><label class="search table-search"><span>⌕</span><input type="search" placeholder="Cliente, cancha o estado..." data-reservation-search></label><label><span>Fecha</span><input type="date" data-reservation-date></label><label><span>Día</span><select data-reservation-day><option value="">Todos</option><option value="1">Lunes</option><option value="2">Martes</option><option value="3">Miércoles</option><option value="4">Jueves</option><option value="5">Viernes</option><option value="6">Sábado</option><option value="0">Domingo</option></select></label><label><span>Hora</span><select data-reservation-hour><option value="">Todas</option>{% for value,label in time_slots %}{% if value|slice:'3:' == '00' %}<option value="{{ value|slice:':2' }}">{{ label }}</option>{% endif %}{% endfor %}</select></label><label><span>Minutos</span><select data-reservation-minute><option value="">Todos</option><option value="00">:00</option><option value="30">:30</option></select></label><button class="clear-filters" data-clear-reservation-filters>Limpiar</button></div>
  <div class="filter-result"><span data-filter-result>{{ reservas_count }} reservas</span><small>Los filtros se combinan automáticamente</small></div>
  {% include 'partials/reservations_table.html' %}
</section>
{% endblock %}
