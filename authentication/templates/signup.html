{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Kancha Sports</title>
    <link rel="stylesheet" href="{% static 'css/signup.css' %}">
    <link rel="icon" type="image/jpeg" href="{% static 'img/Logo.jpeg' %}">
</head>
<body>
    <div class="signup-wrapper">
        
        <div class="signup-left">
            <div class="left-content">
                <img src="{% static 'img/auth-illustration.jpeg' %}" alt="Ilustración de registro en Kancha Sports" class="football-image">
            </div>
        </div>

        <!-- Columna Derecha - Formulario -->
        <div class="signup-right">
            <div class="signup-container">
                <div class="logo-container">
                    <img src="{% static 'img/Logo.jpeg' %}" alt="Logo Kancha Sports" class="logo">
                    <div class="logo-text">Kancha Sports</div>
                    <div class="logo-subtitle">Completa el formulario para registrarte</div>
                </div>

                {% if messages %}
                    <div class="messages">
                        {% for message in messages %}
                            <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}

                <form action="{% url 'signup' %}" method="POST">
                    {% csrf_token %}
                    
                    <!-- Nombre y Apellido en dos columnas -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="first_name">Nombre</label>
                            <input type="text" name="first_name" id="first_name" placeholder="Juan" required>
                        </div>
                        <div class="form-group">
                            <label for="last_name">Apellido</label>
                            <input type="text" name="last_name" id="last_name" placeholder="Pérez" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="dni">DNI</label>
                        <input 
                            type="text" 
                            name="dni" 
                            id="dni" 
                            placeholder="8 dígitos" 
                            required 
                            maxlength="8" 
                            minlength="8" 
                            pattern="\d{8}" 
                            title="Debe contener exactamente 8 números">
                    </div>

                    <div class="form-group">
                        <label for="fecha_nacimiento">Fecha de nacimiento</label>
                        <input type="date" name="fecha_nacimiento" id="fecha_nacimiento" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" name="email" id="email" placeholder="correo@ejemplo.com" required>
                    </div>

                    <div class="form-group">
                        <label for="telefono">Teléfono</label>
                        <input
                            type="tel"
                            name="telefono"
                            id="telefono"
                            placeholder="9 dígitos"
                            required
                            maxlength="9"
                            minlength="9"
                            pattern="\d{9}"
                            title="Debe contener exactamente 9 números"
                        >
                    </div>

                    <div class="form-group">
                        <label for="username">Nombre de usuario</label>
                        <input type="text" name="username" id="username" placeholder="Ej: JuanPerez20" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" name="password" id="password" placeholder="Mínimo 8 caracteres" required>
                    </div>

                    <div class="form-group">
                        <label for="confirm_password">Confirmar contraseña</label>
                        <input type="password" name="confirm_password" id="confirm_password" placeholder="Repite tu contraseña" required>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">Acepto los términos y condiciones y la política de privacidad</label>
                    </div>

                    <button type="submit" class="btn-create">Crear cuenta</button>
                </form>

                <div class="signin-link">
                    ¿Ya tienes una cuenta? <a href="{% url 'signin' %}">Inicia sesión</a>
                </div>

                <div class="footer">
                    Sistema de Reservas de Canchas Deportivas
                </div>
            </div>
        </div>
    </div>
</body>
</html>
